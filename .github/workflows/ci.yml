name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaquitapp
          POSTGRES_PASSWORD: vaquitapp
          POSTGRES_DB: vaquitapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      HUSKY: '0'
      DATABASE_URL: postgresql://vaquitapp:vaquitapp@localhost:5432/vaquitapp?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      LOCAL_STORAGE_SECRET: ci-local-storage-secret-at-least-32-characters

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npx prisma migrate deploy

      - run: npm test

      - run: npm run build
