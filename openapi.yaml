  /files/local/{key}:
    get:
      operationId: downloadLocalFile
      tags:
        - Files
      summary: Download a file from local development storage
      description: |-
        Only exists when the server runs with local storage (development). With S3 storage the download URL from `getAttachmentDownloadUrl` points straight to the bucket and this call is never used. Do not build URLs by hand: use the signed URL exactly as returned. It needs no Authorization header; the `expiresAt` and `signature` query parameters are the authorization.

        **Access:** public, no access token needed.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          description: Storage key from the signed download URL (already URL-encoded in that URL).
          schema:
            type: string
            minLength: 1
        - name: expiresAt
          in: query
          required: true
          description: Expiry of the link, in epoch milliseconds (from the signed URL).
          schema:
            type: number
        - name: signature
          in: query
          required: true
          description: HMAC signature of the link (from the signed URL).
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The raw file content
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: |-
            Unauthorized

