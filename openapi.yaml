    patch:
      operationId: updateExpense
      tags:
        - Expenses
      summary: Update an expense
      description: |-
        Partial update of `description`, `notes` (nullable), `expenseDate`, `categoryId` (nullable) and `paidBy`. The split is always recalculated from scratch, so `amount`, `splitType` and `participants` must be sent **all three together or none** (otherwise 422, reported in `details.formErrors`). How `participants` is read depends on `splitType`: `equal` divides the amount evenly (send only `userId`); `exact` needs an `amount` per participant and they must add up to the total; `percentage` needs a `percentage` (0 to 100) per participant and they must add up to 100; `shares` needs an integer `shares` count per participant and divides proportionally. Each user can appear once (at most 50 participants). Leftover cents are distributed so the parts always add up exactly to the total. A split that does not add up is 422 `INVALID_EXPENSE_SPLIT` with `details: { expected, received }`. A voided expense cannot be edited (409 `EXPENSE_ALREADY_VOIDED`). The currency cannot be changed.

