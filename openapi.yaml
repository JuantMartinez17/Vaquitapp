      summary: Get total spent, total income and net for a date range
      description: |-
        `from` and `to` are required civil dates (YYYY-MM-DD), inclusive; `from` must not be after `to` and the range cannot exceed 366 days (otherwise 422). Only active expenses and non-voided incomes count. There is no unbounded analytics call. `net` is income minus spending and can be negative.

