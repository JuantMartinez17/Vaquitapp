        A template that generates an expense on a schedule: `frequency` is `daily`, `weekly`, `monthly` or `yearly`, starting at `startDate` (a civil date) and ending at the optional `endDate`. For `monthly`, `dayOfMonth` (1 to 31) defaults to the day of `startDate`; shorter months use their last day. `defaultAmount` is a decimal string greater than zero in the household currency. `paidBy` and the participants must be active members. The split is validated now, with the same rules as expenses. How `participants` is read depends on `splitType`: `equal` divides the amount evenly (send only `userId`); `exact` needs an `amount` per participant and they must add up to the total; `percentage` needs a `percentage` (0 to 100) per participant and they must add up to 100; `shares` needs an integer `shares` count per participant and divides proportionally. Each user can appear once (at most 50 participants). Leftover cents are distributed so the parts always add up exactly to the total. A split that does not add up is 422 `INVALID_EXPENSE_SPLIT` with `details: { expected, received }`. Each generated occurrence is created as a `pending` expense that a member must `confirmExpense` or `skipExpense`. Requires an `Idempotency-Key`.

        **Access:** any active member of the household. Anyone who is not one, or whose household does not exist or was deleted, gets 403 `NOT_A_MEMBER`.
      security:
        - bearerAuth: []
      parameters:
        - name: householdId
          in: path
          required: true
          description: Household id.
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: 'Makes the request safe to retry. 1 to 255 printable ASCII characters; generate a UUID v4 when the form opens and reuse it for every retry of that submission. Repeating a key with the same body replays the original 2xx response (with `Idempotency-Replayed: true`); a different body, endpoint or household is 409 `IDEMPOTENCY_KEY_CONFLICT`. Keys live 24 hours; error responses are not stored.'
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[\x20-\x7e]{1,255}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecurringExpenseRequest'
      responses:
        '201':
          description: Recurring expense defined
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringExpense'
        '400':
          description: |-
            Bad request

            - `BAD_REQUEST`: Malformed request: unparseable JSON body, a missing or malformed `Idempotency-Key`, an invalid activity cursor, or an unsupported currency code
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Unauthorized

            - `UNAUTHORIZED`: Missing, invalid or expired access token
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            Forbidden

            - `NOT_A_MEMBER`: The caller is not an active member of the household (also returned when the household does not exist or was deleted), or the targeted user is not one
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            Conflict

            - `IDEMPOTENCY_KEY_CONFLICT`: The `Idempotency-Key` was already used with a different body, endpoint or household
            - `IDEMPOTENCY_KEY_IN_PROGRESS`: A request with the same `Idempotency-Key` is still being processed. Retry after the `Retry-After` delay
            - `CONFLICT`: Generic conflict, for example a unique value that already exists
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: |-
            Payload too large

            - `PAYLOAD_TOO_LARGE`: The JSON request body exceeds 1 MB
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: |-
            Unsupported media type

            - `UNSUPPORTED_MEDIA_TYPE`: The file content is not JPEG, PNG, WEBP or PDF, or the request body uses an unsupported content encoding or charset
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |-
            Validation failed

            - `VALIDATION_ERROR`: The path, query or body failed validation. `details` maps each field to its problems, plus `formErrors` for problems that have no field
            - `INVALID_CURRENCY`: The currency is not the household's currency
            - `INVALID_PAYER`: The payer is not an active member of the household (409 when confirming a pending occurrence whose payer left)
            - `INVALID_PARTICIPANT`: A participant is not an active member of the household (409 when confirming a pending occurrence whose participant left)
            - `INVALID_CATEGORY`: The category is neither global nor owned by this household
            - `INVALID_EXPENSE_SPLIT`: The participants do not add up: exact amounts differ from the total, percentages do not sum to 100, or a required split field is missing
          headers:
