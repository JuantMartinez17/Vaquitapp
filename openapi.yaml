components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from `/auth/register`, `/auth/login` or `/auth/refresh`, sent as `Authorization: Bearer <accessToken>`. Valid for 15 minutes.'
  headers:
    X-Request-Id:
      description: Correlation id of the request. Echoes the `X-Request-Id` the client sent, or a generated one. Quote it when reporting a problem.
      schema:
        type: string
    Retry-After:
      description: Seconds to wait before retrying. Sent with 429, 503 and 409 `IDEMPOTENCY_KEY_IN_PROGRESS`.
      schema:
        type: integer
        minimum: 0
    Idempotency-Replayed:
      description: Present with value `true` when this response is a stored replay of an earlier request with the same `Idempotency-Key`, rather than a fresh execution.
      schema:
        type: string
        enum:
          - 'true'
    RateLimit-Limit:
      description: Requests allowed in the current window by the limiter that answered.
      schema:
        type: integer
    RateLimit-Remaining:
      description: Requests left in the current window.
      schema:
        type: integer
    RateLimit-Reset:
      description: Seconds until the current window resets.
      schema:
        type: integer
    RateLimit-Policy:
      description: Quota policy of the limiter, as `<limit>;w=<window seconds>`.
      schema:
        type: string
        example: 300;w=60
  schemas:
    ActivityItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum:
            - expense
            - income
            - transfer
            - settlement
        date:
          $ref: '#/components/schemas/CivilDate'
        amount:
          $ref: '#/components/schemas/Money'
        description:
          type: string
          description: Expense/income description, or "Payer → Receiver" for transfers and settlements.
      required:
        - id
        - type
        - date
        - amount
        - description
      additionalProperties: false
    ActivityPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ActivityItem'
        nextCursor:
          nullable: true
          description: Pass it as `cursor` to get the next page. Null on the last page.
          type: string
      required:
        - data
        - nextCursor
      additionalProperties: false
    AnalyticsComparison:
      type: object
      properties:
        current:
          $ref: '#/components/schemas/AnalyticsSummary'
        previous:
          $ref: '#/components/schemas/AnalyticsSummary'
      required:
        - current
        - previous
      additionalProperties: false
    AnalyticsSummary:
      type: object
      properties:
        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        from:
          $ref: '#/components/schemas/CivilDate'
        to:
          $ref: '#/components/schemas/CivilDate'
        totalSpent:
          $ref: '#/components/schemas/Money'
        totalIncome:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
      required:
        - currencyCode
        - from
        - to
        - totalSpent
        - totalIncome
        - net
      additionalProperties: false
    Attachment:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        expenseId:
          $ref: '#/components/schemas/Uuid'
        originalFilename:
          type: string
        mimeType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - application/pdf
          description: Detected from the file content, not from the declared Content-Type.
        sizeBytes:
          type: string
          pattern: ^\d+$
          description: Size in bytes, as a decimal string.
        uploadedBy:
          $ref: '#/components/schemas/Uuid'
        uploadedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - expenseId
        - originalFilename
        - mimeType
        - sizeBytes
        - uploadedBy
        - uploadedAt
      additionalProperties: false
    AttachmentDownload:
      type: object
      properties:
        url:
          type: string
          description: Short-lived presigned URL. Absolute with S3 storage; a path relative to the server (`/api/v1/files/local/...`) when the server uses local development storage.
        expiresInSeconds:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          example: 300
      required:
        - url
        - expiresInSeconds
      additionalProperties: false
    AttachmentList:
      type: array
      items:
        $ref: '#/components/schemas/Attachment'
    AuthSession:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: JWT, valid for 15 minutes.
        refreshToken:
          type: string
          description: Opaque, single-use token valid for 30 days. Replace it with every refresh.
      required:
        - user
        - accessToken
        - refreshToken
      additionalProperties: false
    Balances:
      type: object
      properties:
        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        balances:
          type: array
          items:
            $ref: '#/components/schemas/MemberBalance'
          description: Sorted by userId. The nets of all rows add up to zero.
      required:
        - currencyCode
        - balances
      additionalProperties: false
    Category:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        householdId:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Uuid'
        name:
          type: string
        icon:
          nullable: true
          type: string
        color:
          nullable: true
