  /health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Liveness probe
      description: |-
        Answers 200 as long as the process is up. It does not touch the database, so it is safe for a platform health check. Served at the server root, outside `/api/v1`.

        **Access:** public, no access token needed.
      security: []
      servers:
        - url: /
          description: Server root, outside the /api/v1 prefix
      responses:
        '200':
          description: The process is alive
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
  /health/ready:
    get:
      operationId: getReadiness
      tags:
        - Health
      summary: Readiness probe
      description: |-
        Pings the database with a 2-second timeout. 200 when it answers, 503 when it fails or hangs. The 503 body is **not** the error envelope. Served at the server root, outside `/api/v1`.

        **Access:** public, no access token needed.
      security: []
      servers:
        - url: /
          description: Server root, outside the /api/v1 prefix
      responses:
        '200':
          description: The database answers
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
