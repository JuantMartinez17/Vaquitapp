                $ref: '#/components/schemas/Error'
        '415':
          description: |-
            Unsupported media type

            - `UNSUPPORTED_MEDIA_TYPE`: The file content is not JPEG, PNG, WEBP or PDF, or the request body uses an unsupported content encoding or charset
          headers:
            X-Request-Id:
