  /households/{householdId}/transfers:
    post:
      operationId: createTransfer
      tags:
        - Transfers
      summary: Record a transfer between two members
      description: |-
        Records that `fromUser` moved `amount` to `toUser`. The caller must be one of the two parties (otherwise 403 `FORBIDDEN`); both must be active members and different. Unlike a settlement, a transfer does not move balances. `amount` is a decimal string with up to 2 decimals, greater than zero, in the household currency. Requires an `Idempotency-Key`.

        **Access:** any active member of the household. Anyone who is not one, or whose household does not exist or was deleted, gets 403 `NOT_A_MEMBER`.
      security:
        - bearerAuth: []
      parameters:
        - name: householdId
          in: path
          required: true
          description: Household id.
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: 'Makes the request safe to retry. 1 to 255 printable ASCII characters; generate a UUID v4 when the form opens and reuse it for every retry of that submission. Repeating a key with the same body replays the original 2xx response (with `Idempotency-Replayed: true`); a different body, endpoint or household is 409 `IDEMPOTENCY_KEY_CONFLICT`. Keys live 24 hours; error responses are not stored.'
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[\x20-\x7e]{1,255}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '201':
          description: Transfer recorded (does not move balances)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          description: |-
            Bad request

            - `BAD_REQUEST`: Malformed request: unparseable JSON body, a missing or malformed `Idempotency-Key`, an invalid activity cursor, or an unsupported currency code
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Unauthorized

            - `UNAUTHORIZED`: Missing, invalid or expired access token
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            Forbidden

            - `NOT_A_MEMBER`: The caller is not an active member of the household (also returned when the household does not exist or was deleted), or the targeted user is not one
            - `FORBIDDEN`: Authenticated but not allowed to do this
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            Conflict

            - `IDEMPOTENCY_KEY_CONFLICT`: The `Idempotency-Key` was already used with a different body, endpoint or household
            - `IDEMPOTENCY_KEY_IN_PROGRESS`: A request with the same `Idempotency-Key` is still being processed. Retry after the `Retry-After` delay
            - `CONFLICT`: Generic conflict, for example a unique value that already exists
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: |-
            Payload too large

            - `PAYLOAD_TOO_LARGE`: The JSON request body exceeds 1 MB
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: |-
