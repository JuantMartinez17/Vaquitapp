    get:
      operationId: listExpenses
      tags:
        - Expenses
      summary: List expenses
      description: |-
        Newest expense date first (ties by id), cursor-paginated. Voided expenses are excluded unless `includeVoided=true`; `status` filters to exactly one status (including `voided` or `pending`) and takes precedence over `includeVoided`. `from` and `to` are inclusive civil dates. `participantId` matches expenses where that user has a split. Filters combine with AND.

        **Access:** any active member of the household. Anyone who is not one, or whose household does not exist or was deleted, gets 403 `NOT_A_MEMBER`.
      security:
        - bearerAuth: []
      parameters:
        - name: householdId
          in: path
          required: true
          description: Household id.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Pass the previous response `nextCursor` to get the next page. Treat it as opaque; omit it for the first page.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: First day of the range, inclusive (YYYY-MM-DD).
          schema:
            type: string
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: to
          in: query
          required: false
          description: Last day of the range, inclusive (YYYY-MM-DD).
          schema:
            type: string
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: categoryId
          in: query
          required: false
          description: Category id.
          schema:
            type: string
            format: uuid
        - name: paidBy
          in: query
          required: false
          description: Only expenses paid by this user.
          schema:
            type: string
            format: uuid
        - name: participantId
          in: query
          required: false
          description: Only expenses where this user has a split.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Return only expenses in this status. Overrides `includeVoided`.
          schema:
            type: string
            enum:
              - active
              - voided
              - pending
        - name: includeVoided
          in: query
          required: false
          description: Include voided rows, which are hidden by default.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
      responses:
        '200':
          description: Paginated expenses
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpensePage'
        '401':
          description: |-
