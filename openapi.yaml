openapi: 3.0.3
info:
  title: Vaquitapp API
  version: 1.0.0
  description: |-
    Backend of Vaquitapp, a shared-expenses app organised around **households**: a group of people that
    share one currency, record expenses, settle debts and track income together.

    This document is the contract a client (mobile or web) is built from. Every response schema in it is
    verified against the real server by an automated test, so what you read here is what the API returns.

    ## Base URL and versioning

    All operations live under `/api/v1`, except the two health checks (`/health` and `/health/ready`),
    which are served at the server root. Requests and responses are JSON (`application/json`), except the
    attachment upload (`multipart/form-data`). Property names are camelCase.

    ## Authentication

    1. `POST /auth/register` or `POST /auth/login` returns `{ user, accessToken, refreshToken }`.
    2. Send the access token on every protected call: `Authorization: Bearer <accessToken>`.
    3. The **access token** is a JWT that lasts **15 minutes**. When a call answers 401 `UNAUTHORIZED`,
       call `POST /auth/refresh` with the refresh token and retry once.
    4. The **refresh token** is opaque, lasts **30 days** and is **single use**: every refresh returns a new
       pair and revokes the old refresh token. Always store the newest one.
    5. **Reuse detection:** presenting an already-used refresh token is treated as theft. The server revokes
       **every session** of that user and answers 401 `TOKEN_REUSE_DETECTED`: send the user to the login
       screen. Never fire two refreshes in parallel with the same token (serialize them in the client).
    6. `POST /auth/logout` revokes one refresh token; `POST /auth/logout-all` revokes all of them.

    ## Households and roles

    Most data is scoped to a household: `/households/{householdId}/...`. The caller must be an **active
    member** of it; some operations need the **admin** role. A household that does not exist, was deleted,
    or that the caller does not belong to always answers 403 `NOT_A_MEMBER` (never 404), so ids cannot be
    probed. Each operation states the role it needs. A household always keeps at least one admin.

    A household has a single currency (`defaultCurrencyCode`, ARS by default). Every amount in it uses that
    currency, there is no conversion, and it cannot be changed once the household has any financial record.
    People who leave stay in the history (balances flag them with `isFormerMember`) but cannot be picked as
    payer, participant or party of new records.

    ## Conventions

    - **Money** is a **string** with a decimal point, never a JSON number: `"85000.00"`. Responses print as
      many decimals as the currency has (`Currency.decimalPlaces`: 2 for ARS or USD, 0 for CLP). Requests
      accept up to 12 integer digits and up to 2 decimals (`^\d{1,12}(\.\d{1,2})?$`), non-negative; the
      server rounds half-up to the currency. Net balances in responses can be negative.
    - **Business dates** (`expenseDate`, `incomeDate`, `settlementDate`, `transferDate`, recurring
      `startDate`...) are **civil dates** `YYYY-MM-DD`: no time, no timezone. Years 1900 to 2100. Send the
      day the user picked, exactly as written.
    - **System timestamps** (`createdAt`, `updatedAt`, `joinedAt`...) are ISO-8601 in **UTC**,
      for example `2026-08-15T14:30:00.000Z`.
    - **Ids** are UUIDs. A malformed id in a path or query is a 422 `VALIDATION_ERROR`.
    - **Pagination** is cursor-based on expenses, settlements, incomes, transfers and the activity feed:
      `?limit=` (1 to 100, default 20) and `?cursor=`. The response is `{ "data": [...], "nextCursor": string | null }`.
      Pass `nextCursor` back as `cursor` to get the next page; `null` means there is no more. Cursors of the
      four record lists are row ids (a non-UUID is a 422); the activity feed uses an opaque cursor (an
      invalid one is a 400). There is no `page` or `total`. Every other list is bounded and returned as a bare array.
    - **Voiding, not deleting:** `DELETE` on expenses, settlements, incomes and transfers voids the record.
      Voided rows are hidden from lists unless `?includeVoided=true` and never count in balances or analytics.
    - **Unknown fields** in a request body are rejected (422), and `PATCH` bodies are partial: send only
      the fields to change; nullable fields are cleared with `null`.
    - **Tracing:** every response carries `X-Request-Id`. Send your own to correlate client and server logs.

    ## Idempotency

    `POST` on **expenses, settlements, incomes, transfers and recurring-expenses** requires an
    `Idempotency-Key` header (1 to 255 printable ASCII characters; a missing or malformed one is a 400).
    Generate a **UUID v4 when the form opens** and reuse it for every retry of that submission, so a flaky
    network cannot create duplicates.

    - Same key and same body: the original 2xx response is **replayed** (same status and body) with the
      header `Idempotency-Replayed: true`.
    - Same key with a different body, endpoint or household: 409 `IDEMPOTENCY_KEY_CONFLICT`.
    - Same key while the first request is still running: 409 `IDEMPOTENCY_KEY_IN_PROGRESS` with
      `Retry-After`; wait and resend.
    - Keys are remembered for **24 hours**. Only successful (2xx) responses are stored: after an error you
      can fix the request and resend with the same key.

    The checks run in this order: authentication, path/query/body validation (422), household membership
    (403), then the key (400) and its conflicts (409).

    ## Errors

    Every failure uses the same envelope. Clients branch on `error.code`, never on `error.message`
    (English, for debugging only):

    ```json
    { "error": { "code": "VALIDATION_ERROR", "message": "Invalid data", "details": { "amount": ["Must be a decimal"] } } }
    ```

    - `VALIDATION_ERROR` (422): `details` maps each field to a list of problems, plus an optional
      `formErrors: string[]` for problems without a field (unknown keys, rules across fields).
    - `MEMBER_HAS_OPEN_BALANCE` (409): `details.net` is the member's net balance.
    - 400 `BAD_REQUEST` is a malformed request (unparseable JSON, bad `Idempotency-Key`, bad activity
      cursor); 413 `PAYLOAD_TOO_LARGE` is a JSON body over 1 MB; 415 `UNSUPPORTED_MEDIA_TYPE` is an
      unsupported content encoding or an unaccepted attachment type.
    - 503 `SERVICE_UNAVAILABLE` (database down or slow) and 503 `UPLOAD_CAPACITY_EXCEEDED` carry
      `Retry-After`. Retry those with backoff; do not retry other 4xx without changing the request.
    - Unmapped uniqueness violations are 409 `CONFLICT`.

    ### Error codes

    | Code | Meaning |
    | --- | --- |
    | `BAD_REQUEST` | Malformed request: unparseable JSON body, a missing or malformed `Idempotency-Key`, an invalid activity cursor, or an unsupported currency code |
    | `UNAUTHORIZED` | Missing, invalid or expired access token |
    | `FORBIDDEN` | Authenticated but not allowed to do this |
    | `NOT_FOUND` | The resource does not exist in this household (or the route does not exist) |
    | `CONFLICT` | Generic conflict, for example a unique value that already exists |
    | `VALIDATION_ERROR` | The path, query or body failed validation. `details` maps each field to its problems, plus `formErrors` for problems that have no field |
    | `INTERNAL_ERROR` | Unexpected server failure; details are never exposed |
    | `TOKEN_REUSE_DETECTED` | A refresh token that was already rotated was presented again. Every session of the user was revoked: send the user to the login screen |
    | `EMAIL_ALREADY_REGISTERED` | An account with that email already exists |
    | `USERNAME_TAKEN` | That username is already taken |
    | `INVALID_CREDENTIALS` | Wrong email or password |
    | `HOUSEHOLD_NOT_FOUND` | The household does not exist or was deleted |
    | `NOT_A_MEMBER` | The caller is not an active member of the household (also returned when the household does not exist or was deleted), or the targeted user is not one |
    | `INSUFFICIENT_ROLE` | The action requires the `admin` role |
    | `LAST_ADMIN` | The household would be left without an admin |
    | `MEMBER_HAS_OPEN_BALANCE` | The member has a non-zero net balance and must settle up first. `details.net` carries the amount |
    | `HOUSEHOLD_CURRENCY_LOCKED` | The default currency cannot change once the household has any financial record (expenses, settlements, incomes, transfers or recurring expenses, voided ones included) |
    | `INVITATION_NOT_FOUND` | No invitation with that token (or id) exists |
    | `INVITATION_EXPIRED` | The invitation passed its 7-day deadline |
    | `INVITATION_ALREADY_RESOLVED` | The invitation was already accepted or rejected |
    | `INVITATION_ALREADY_PENDING` | There already is a pending invitation for that email |
    | `ALREADY_MEMBER` | The user is already an active member of the household |
    | `INVALID_PAYER` | The payer is not an active member of the household (409 when confirming a pending occurrence whose payer left) |
    | `INVALID_PARTICIPANT` | A participant is not an active member of the household (409 when confirming a pending occurrence whose participant left) |
    | `INVALID_EXPENSE_SPLIT` | The participants do not add up: exact amounts differ from the total, percentages do not sum to 100, or a required split field is missing |
    | `INVALID_CATEGORY` | The category is neither global nor owned by this household |
    | `INVALID_CURRENCY` | The currency is not the household's currency |
    | `EXPENSE_ALREADY_VOIDED` | The expense was already voided |
    | `INVALID_SETTLEMENT` | fromUser equals toUser, the amount rounds to zero, or a party is not an active member |
    | `SETTLEMENT_ALREADY_VOIDED` | The settlement was already voided |
    | `INVALID_TRANSFER` | fromUser equals toUser, the amount rounds to zero, or a party is not an active member |
    | `INCOME_ALREADY_VOIDED` | The income was already voided |
    | `TRANSFER_ALREADY_VOIDED` | The transfer was already voided |
    | `RECURRING_OCCURRENCE_NOT_PENDING` | Only an expense with status `pending` can be confirmed or skipped |
    | `ATTACHMENT_TOO_LARGE` | The file exceeds the upload limit (10 MB by default) |
    | `UNSUPPORTED_MEDIA_TYPE` | The file content is not JPEG, PNG, WEBP or PDF, or the request body uses an unsupported content encoding or charset |
    | `TOO_MANY_ATTACHMENTS` | The expense already has 5 attachments |
    | `UPLOAD_CAPACITY_EXCEEDED` | The server is processing too many uploads right now. Retry after the `Retry-After` delay |
    | `IDEMPOTENCY_KEY_CONFLICT` | The `Idempotency-Key` was already used with a different body, endpoint or household |
    | `IDEMPOTENCY_KEY_IN_PROGRESS` | A request with the same `Idempotency-Key` is still being processed. Retry after the `Retry-After` delay |
    | `RATE_LIMITED` | Too many requests from this IP address; see `Retry-After` |
    | `PAYLOAD_TOO_LARGE` | The JSON request body exceeds 1 MB |
    | `SERVICE_UNAVAILABLE` | The database is unreachable or timed out. Retry after the `Retry-After` delay |

    ## Rate limiting

    Limits are per client IP and answer 429 `RATE_LIMITED` with `Retry-After` (seconds):

    - a global ceiling on all of `/api/v1` (300 requests per minute by default);
    - login counts only **failed** attempts; register and refresh have their own budgets.

    Every limited response carries the standard `RateLimit-Limit`, `RateLimit-Remaining`,
    `RateLimit-Reset` and `RateLimit-Policy` headers of the limiter that last handled it.

    ## Health checks

    `GET /health` is liveness: it answers 200 without touching the database. `GET /health/ready` is
    readiness: it pings the database and answers 503 when it cannot. Neither needs authentication nor
    counts against the rate limit.
servers:
  - url: /api/v1
    description: API v1. Health checks live at the server root.
tags:
  - name: Auth
    description: Registration, login and token rotation. Public except `logout-all`; rate limited per IP.
  - name: Users
    description: 'The authenticated user: profile and received invitations.'
  - name: Households
    description: 'Create and manage households and their members. Roles: `admin` (manage the household) and `member`.'
  - name: Invitations
    description: Invite people by email (admin) and accept or reject an invitation (the invitee). Invitations expire after 7 days.
  - name: Categories
    description: Global system categories plus the custom categories of each household.
  - name: Expenses
    description: 'Shared expenses and how they are split among members: `equal`, `exact`, `percentage` or `shares`.'
  - name: Settlements
    description: Payments between two members that reduce what they owe each other.
  - name: Balances
    description: Derived net balance per member and a minimal debt graph.
  - name: Incomes
    description: 'Money received by a member. Informational: does not move balances.'
  - name: Transfers
    description: 'Money moved between two members. Informational: does not move balances.'
  - name: Activity
    description: Unified, newest-first feed of expenses, incomes, transfers and settlements.
  - name: RecurringExpenses
    description: Templates that generate a `pending` expense on each due date, to be confirmed or skipped.
  - name: Attachments
    description: Receipts and invoices (JPEG, PNG, WEBP or PDF) attached to an expense.
  - name: Analytics
    description: Aggregates over an explicit date range of at most 366 days.
  - name: Currencies
    description: Catalog of supported currencies.
  - name: Files
    description: Download endpoint behind the local-development storage.
  - name: Health
    description: Liveness and readiness probes, served outside `/api/v1`.
paths:
  /auth/register:
    post:
      operationId: registerUser
      tags:
        - Auth
      summary: Register a new user
      description: |-
        Creates the account and signs it in. `email` is stored lower-cased. `username` is 3 to 50 letters, digits or underscores. `password` is at least 8 characters and at most 72 bytes in UTF-8. `preferredCurrencyCode` defaults to ARS and must be a supported currency (see `listCurrencies`). Rate limited per IP.

        **Access:** public, no access token needed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: User created; returns the user and a token pair
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: |-
            Bad request

            - `BAD_REQUEST`: Malformed request: unparseable JSON body, a missing or malformed `Idempotency-Key`, an invalid activity cursor, or an unsupported currency code
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            Conflict

            - `CONFLICT`: Generic conflict, for example a unique value that already exists
            - `EMAIL_ALREADY_REGISTERED`: An account with that email already exists
            - `USERNAME_TAKEN`: That username is already taken
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: |-
            Payload too large

            - `PAYLOAD_TOO_LARGE`: The JSON request body exceeds 1 MB
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: |-
            Unsupported media type

            - `UNSUPPORTED_MEDIA_TYPE`: The file content is not JPEG, PNG, WEBP or PDF, or the request body uses an unsupported content encoding or charset
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |-
            Validation failed

            - `VALIDATION_ERROR`: The path, query or body failed validation. `details` maps each field to its problems, plus `formErrors` for problems that have no field
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |-
            Too many requests

            - `RATE_LIMITED`: Too many requests from this IP address; see `Retry-After`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |-
            Unexpected server error

            - `INTERNAL_ERROR`: Unexpected server failure; details are never exposed
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |-
            Service unavailable

            - `SERVICE_UNAVAILABLE`: The database is unreachable or timed out. Retry after the `Retry-After` delay
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      operationId: loginUser
      tags:
        - Auth
      summary: Log in with email and password
      description: |-
        Returns the user and a fresh token pair. Only **failed** attempts count against the login rate limit. The error never reveals whether the email or the password was wrong.

        **Access:** public, no access token needed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserRequest'
      responses:
        '200':
          description: Returns the user and a token pair
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: |-
            Bad request

            - `BAD_REQUEST`: Malformed request: unparseable JSON body, a missing or malformed `Idempotency-Key`, an invalid activity cursor, or an unsupported currency code
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Unauthorized

            - `INVALID_CREDENTIALS`: Wrong email or password
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            Conflict

            - `CONFLICT`: Generic conflict, for example a unique value that already exists
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: |-
            Payload too large

            - `PAYLOAD_TOO_LARGE`: The JSON request body exceeds 1 MB
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: |-
            Unsupported media type

            - `UNSUPPORTED_MEDIA_TYPE`: The file content is not JPEG, PNG, WEBP or PDF, or the request body uses an unsupported content encoding or charset
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |-
            Validation failed

            - `VALIDATION_ERROR`: The path, query or body failed validation. `details` maps each field to its problems, plus `formErrors` for problems that have no field
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |-
            Too many requests

            - `RATE_LIMITED`: Too many requests from this IP address; see `Retry-After`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |-
            Unexpected server error

            - `INTERNAL_ERROR`: Unexpected server failure; details are never exposed
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |-
            Service unavailable

            - `SERVICE_UNAVAILABLE`: The database is unreachable or timed out. Retry after the `Retry-After` delay
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      operationId: refreshTokens
      tags:
        - Auth
      summary: Rotate a refresh token
      description: |-
        Exchanges a refresh token for a new access token and a **new refresh token**; the presented one is revoked. Presenting an already-used (or concurrently used) refresh token revokes every session of the user and answers `TOKEN_REUSE_DETECTED`. Do not send two refreshes with the same token at the same time.

        **Access:** public, no access token needed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokensRequest'
      responses:
        '200':
          description: Returns a new token pair; the old refresh token is revoked
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: |-
            Bad request

            - `BAD_REQUEST`: Malformed request: unparseable JSON body, a missing or malformed `Idempotency-Key`, an invalid activity cursor, or an unsupported currency code
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Unauthorized

            - `UNAUTHORIZED`: Missing, invalid or expired access token
            - `TOKEN_REUSE_DETECTED`: A refresh token that was already rotated was presented again. Every session of the user was revoked: send the user to the login screen
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            Conflict

            - `CONFLICT`: Generic conflict, for example a unique value that already exists
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: |-
            Payload too large

            - `PAYLOAD_TOO_LARGE`: The JSON request body exceeds 1 MB
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: |-
            Unsupported media type

            - `UNSUPPORTED_MEDIA_TYPE`: The file content is not JPEG, PNG, WEBP or PDF, or the request body uses an unsupported content encoding or charset
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |-
            Validation failed

            - `VALIDATION_ERROR`: The path, query or body failed validation. `details` maps each field to its problems, plus `formErrors` for problems that have no field
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |-
            Too many requests

            - `RATE_LIMITED`: Too many requests from this IP address; see `Retry-After`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |-
            Unexpected server error

            - `INTERNAL_ERROR`: Unexpected server failure; details are never exposed
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |-
            Service unavailable

            - `SERVICE_UNAVAILABLE`: The database is unreachable or timed out. Retry after the `Retry-After` delay
          headers:
            X-Request-Id:
