  /households/{householdId}/expenses:
    post:
      operationId: createExpense
      tags:
        - Expenses
      summary: Create an expense with its splits
      description: |-
        Records an expense paid by one member and split among the participants. `amount` is a decimal string with up to 2 decimals and must be greater than zero; `currencyCode` must be the household's currency; `expenseDate` is a civil date (YYYY-MM-DD); `paidBy` and every participant must be active members; `categoryId` is optional and must be global or the household's. How `participants` is read depends on `splitType`: `equal` divides the amount evenly (send only `userId`); `exact` needs an `amount` per participant and they must add up to the total; `percentage` needs a `percentage` (0 to 100) per participant and they must add up to 100; `shares` needs an integer `shares` count per participant and divides proportionally. Each user can appear once (at most 50 participants). Leftover cents are distributed so the parts always add up exactly to the total. A split that does not add up is 422 `INVALID_EXPENSE_SPLIT` with `details: { expected, received }`. The expense is created `active` and counts toward balances immediately. Requires an `Idempotency-Key`.

        **Access:** any active member of the household. Anyone who is not one, or whose household does not exist or was deleted, gets 403 `NOT_A_MEMBER`.
      security:
        - bearerAuth: []
      parameters:
        - name: householdId
          in: path
          required: true
          description: Household id.
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: 'Makes the request safe to retry. 1 to 255 printable ASCII characters; generate a UUID v4 when the form opens and reuse it for every retry of that submission. Repeating a key with the same body replays the original 2xx response (with `Idempotency-Replayed: true`); a different body, endpoint or household is 409 `IDEMPOTENCY_KEY_CONFLICT`. Keys live 24 hours; error responses are not stored.'
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[\x20-\x7e]{1,255}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
      responses:
        '201':
          description: Expense created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          description: |-
            Bad request

            - `BAD_REQUEST`: Malformed request: unparseable JSON body, a missing or malformed `Idempotency-Key`, an invalid activity cursor, or an unsupported currency code
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Unauthorized

            - `UNAUTHORIZED`: Missing, invalid or expired access token
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            Forbidden

            - `NOT_A_MEMBER`: The caller is not an active member of the household (also returned when the household does not exist or was deleted), or the targeted user is not one
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            Conflict

            - `IDEMPOTENCY_KEY_CONFLICT`: The `Idempotency-Key` was already used with a different body, endpoint or household
            - `IDEMPOTENCY_KEY_IN_PROGRESS`: A request with the same `Idempotency-Key` is still being processed. Retry after the `Retry-After` delay
            - `CONFLICT`: Generic conflict, for example a unique value that already exists
          headers:
