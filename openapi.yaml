      operationId: createIncome
      tags:
        - Incomes
      summary: Record an income
      description: |-
        Money received by a member (`receivedBy`, an active member). `amount` is a decimal string with up to 2 decimals, greater than zero, in the household currency; `incomeDate` is a civil date; `categoryId` is optional. Incomes do not move balances; they feed analytics and the activity feed. Requires an `Idempotency-Key`.

        **Access:** any active member of the household. Anyone who is not one, or whose household does not exist or was deleted, gets 403 `NOT_A_MEMBER`.
      security:
        - bearerAuth: []
      parameters:
        - name: householdId
          in: path
          required: true
          description: Household id.
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: 'Makes the request safe to retry. 1 to 255 printable ASCII characters; generate a UUID v4 when the form opens and reuse it for every retry of that submission. Repeating a key with the same body replays the original 2xx response (with `Idempotency-Replayed: true`); a different body, endpoint or household is 409 `IDEMPOTENCY_KEY_CONFLICT`. Keys live 24 hours; error responses are not stored.'
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[\x20-\x7e]{1,255}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncomeRequest'
      responses:
        '201':
          description: Income recorded (does not move balances)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Income'
