  /households/{householdId}/expenses/{expenseId}/attachments:
    post:
      operationId: uploadAttachment
      tags:
        - Attachments
      summary: Upload a receipt or invoice
      description: |-
        Multipart upload with exactly one file in the `file` field. The type is detected from the file content (JPEG, PNG, WEBP or PDF), never from the declared Content-Type, and the size limit is 10 MB by default. An expense holds at most 5 attachments. Uploading a file identical to one already attached to the expense returns that existing attachment (still 201) instead of storing a copy. Voided expenses cannot get attachments. The server limits concurrent uploads: on 503 `UPLOAD_CAPACITY_EXCEEDED` retry after `Retry-After`.

        **Access:** any active member of the household. Anyone who is not one, or whose household does not exist or was deleted, gets 403 `NOT_A_MEMBER`.
      security:
        - bearerAuth: []
      parameters:
        - name: householdId
          in: path
          required: true
          description: Household id.
          schema:
            type: string
            format: uuid
        - name: expenseId
          in: path
          required: true
          description: Expense id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadAttachmentRequest'
      responses:
        '201':
          description: Attachment stored (or the identical existing one)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
