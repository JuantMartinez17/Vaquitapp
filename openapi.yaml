      required:
        - currencyCode
        - simplified
      additionalProperties: false
    SimplifiedTransfer:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/Uuid'
        fromDisplayName:
          nullable: true
          type: string
        fromIsFormerMember:
          type: boolean
        to:
          $ref: '#/components/schemas/Uuid'
        toDisplayName:
          nullable: true
          type: string
        toIsFormerMember:
          type: boolean
        amount:
          $ref: '#/components/schemas/Money'
      required:
        - from
        - fromDisplayName
        - fromIsFormerMember
        - to
        - toDisplayName
        - toIsFormerMember
        - amount
      additionalProperties: false
    SplitType:
      type: string
      enum:
        - equal
        - exact
        - percentage
        - shares
    TimeSeries:
      type: array
      items:
        $ref: '#/components/schemas/TimeSeriesPoint'
    TimeSeriesPoint:
      type: object
      properties:
        date:
          $ref: '#/components/schemas/CivilDate'
        totalSpent:
          $ref: '#/components/schemas/Money'
      required:
        - date
        - totalSpent
      additionalProperties: false
    Timestamp:
      type: string
      format: date-time
      description: System timestamp, ISO-8601 in UTC with milliseconds.
      example: 2026-08-15T14:30:00.000Z
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT, valid for 15 minutes.
        refreshToken:
          type: string
          description: Opaque, single-use token valid for 30 days. Replace it with every refresh.
      required:
        - accessToken
        - refreshToken
      additionalProperties: false
    Transfer:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        householdId:
          $ref: '#/components/schemas/Uuid'
        from:
          $ref: '#/components/schemas/UserRef'
        to:
          $ref: '#/components/schemas/UserRef'
        amount:
          $ref: '#/components/schemas/Money'
        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        transferDate:
          $ref: '#/components/schemas/CivilDate'
        notes:
          nullable: true
          type: string
        voided:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - householdId
        - from
        - to
        - amount
        - currencyCode
        - transferDate
        - notes
        - voided
        - createdAt
      additionalProperties: false
    TransferPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transfer'
        nextCursor:
          nullable: true
          description: Pass it as `cursor` to get the next page. Null on the last page.
          type: string
      required:
        - data
        - nextCursor
      additionalProperties: false
    UpcomingRecurringExpense:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        description:
          type: string
        defaultAmount:
          $ref: '#/components/schemas/Money'
        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        nextRunDate:
          $ref: '#/components/schemas/CivilDate'
        overdue:
          type: boolean
          description: True when `nextRunDate` is today or earlier.
      required:
        - id
        - description
        - defaultAmount
        - currencyCode
        - nextRunDate
        - overdue
      additionalProperties: false
    UpcomingRecurringExpenseList:
      type: array
      items:
        $ref: '#/components/schemas/UpcomingRecurringExpense'
    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        icon:
          nullable: true
          type: string
          minLength: 0
          maxLength: 50
        color:
          nullable: true
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
      additionalProperties: false
    UpdateCurrentUserRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        avatarUrl:
          type: string
          maxLength: 2048
          format: uri
        preferredCurrencyCode:
          type: string
          pattern: ^[A-Za-z]{3}$
      additionalProperties: false
    UpdateExpenseRequest:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
        notes:
          nullable: true
          type: string
          minLength: 0
          maxLength: 2000
        expenseDate:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        categoryId:
          nullable: true
          type: string
          format: uuid
        paidBy:
          type: string
          format: uuid
        amount:
          type: string
          pattern: ^\d{1,12}(\.\d{1,2})?$
        splitType:
          type: string
          enum:
            - equal
            - exact
            - percentage
            - shares
        participants:
          minItems: 1
          maxItems: 50
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
                format: uuid
              amount:
                type: string
                pattern: ^\d{1,12}(\.\d{1,2})?$
              percentage:
                type: number
                minimum: 0
                maximum: 100
              shares:
                type: integer
                minimum: 0
                exclusiveMinimum: true
                maximum: 1000000
            required:
              - userId
            additionalProperties: false
      additionalProperties: false
    UpdateHouseholdRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          nullable: true
          type: string
          maxLength: 2000
        defaultCurrencyCode:
          type: string
          minLength: 3
          maxLength: 3
      additionalProperties: false
    UpdateIncomeRequest:
      type: object
      properties:
        receivedBy:
          type: string
          format: uuid
        description:
          type: string
          minLength: 1
          maxLength: 255
        notes:
          nullable: true
          type: string
          minLength: 0
          maxLength: 2000
        amount:
          type: string
          pattern: ^\d{1,12}(\.\d{1,2})?$
        categoryId:
          nullable: true
          type: string
          format: uuid
        incomeDate:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
      additionalProperties: false
    UpdateMemberRoleRequest:
      type: object
      properties:
        role:
          type: string
          enum:
            - admin
            - member
      required:
        - role
      additionalProperties: false
    UpdateRecurringExpenseRequest:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
        categoryId:
          nullable: true
          type: string
          format: uuid
        paidBy:
          type: string
          format: uuid
        endDate:
          nullable: true
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        isActive:
          type: boolean
      additionalProperties: false
    UploadAttachmentRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG, WEBP or PDF, at most 10 MB by default. The type is detected from the content, not from the declared Content-Type.
      required:
        - file
    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
        username:
          type: string
        displayName:
          nullable: true
          type: string
        avatarUrl:
          nullable: true
          type: string
        preferredCurrencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        emailVerified:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - email
        - username
        - displayName
        - avatarUrl
        - preferredCurrencyCode
        - emailVerified
        - createdAt
        - updatedAt
      additionalProperties: false
    UserRef:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        displayName:
          nullable: true
          type: string
      required:
        - id
        - displayName
      additionalProperties: false
    Uuid:
      type: string
      format: uuid
      description: UUID v4 identifier.
