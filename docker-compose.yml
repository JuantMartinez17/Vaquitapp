services:
  postgres:
    image: postgres:16-alpine
    container_name: vaquitapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaquitapp
      POSTGRES_PASSWORD: vaquitapp_dev
      POSTGRES_DB: vaquitapp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
