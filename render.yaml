# Render Blueprint — un solo Web Service, en el plan Free.
#
# La base (Neon) y el almacenamiento (Cloudflare R2) son externos y NO se
# declaran acá: sus credenciales se cargan a mano en el dashboard.
#
# Por qué no hay `databases:`  — el Postgres Free de Render expira a los 30
# días y borra los datos 14 días después. El plan Free de Neon no expira.
# Por qué no hay `preDeployCommand` — Render solo lo ofrece en planes pagos,
# así que `prisma migrate deploy` se corre a mano contra la URL directa de
# Neon (ver README § Deploy).
#
# Los secrets marcados `sync: false` se cargan una vez en el dashboard; nunca
# se commitean.

services:
  - type: web
    name: vaquitapp-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    # /health, NOT /health/ready: Render hits this path constantly, and a DB
    # ping each time would keep Neon's free compute awake and burn its quota.
    # A database blip must also not make Render restart a healthy process.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon: usar la connection string POOLED (host con `-pooler`).
      # La directa queda para las migraciones.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # Sirve aunque el servicio duerma: startInterval corre el job al
      # arrancar, generateDueOccurrences es idempotente y dueDates() recupera
      # los días perdidos, así que las ocurrencias se generan en cada wake-up.
      - key: ENABLE_SCHEDULER
        value: 'true'
      # El filesystem de Render es efímero y un disco persistente rompería
      # los deploys sin downtime, así que los adjuntos van a R2.
      - key: STORAGE_PROVIDER
        value: s3
      # Obligatorio: sin endpoint el SDK asume AWS y R2 nunca recibe nada.
      # Formato: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: AUTH_RATE_LIMIT_MAX
        value: '20'
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: '900000'
